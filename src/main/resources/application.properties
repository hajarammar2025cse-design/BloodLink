# ======================================================
# BloodLink Application Configuration
# ======================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=bloodlink

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bloodlink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:hajarAmma@08}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
